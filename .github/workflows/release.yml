name: Release Hally Cafe WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-plugin:
    name: Package & Attach WordPress Plugin to GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package WordPress Plugins
        run: |
          python3 scripts/package-plugin.py
          ls -lh public/*.zip

      - name: Upload Plugin to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            public/HallyCafe-OS.zip
            public/hally-cafe.zip
          name: HallyCafe OS WordPress Plugin ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
